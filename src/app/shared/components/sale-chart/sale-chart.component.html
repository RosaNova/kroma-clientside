<div class="bg-card rounded-xl p-6 shadow-sm">
  <div class="flex items-center justify-between mb-6">
    <select
      class="bg-secondary text-secondary-foreground px-3 py-1.5 rounded-lg text-sm"
      [value]="selectedYearType"
      (change)="onYearTypeChange($any($event.target).value)">
      <option value="current">ឆ្នាំនេះ</option>
      <option value="previous">ឆ្នាំមុន</option>
    </select>
  </div>

  <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
    [yaxis]="chartOptions.yaxis" [plotOptions]="chartOptions.plotOptions" [colors]="chartOptions.colors">
  </apx-chart>
</div>
