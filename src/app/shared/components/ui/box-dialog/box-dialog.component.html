<dialog #dialog class="modal">
    <div class="modal-box p-0 bg-card text-card-foreground"
         [class.max-w-sm]="size === 'sm'"
         [class.max-w-md]="size === 'md'"
         [class.max-w-lg]="size === 'lg'"
         [class.max-w-xl]="size === 'xl'"
         [class.max-w-2xl]="size === '2xl'"
         [class.max-w-3xl]="size === '3xl'"
         [class.max-w-4xl]="size === '4xl'"
         [class.max-w-5xl]="size === '5xl'">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-border">
            <h3 class="text-lg font-semibold">{{ title }}</h3>
            <button class="btn btn-sm btn-circle btn-ghost" (click)="closeModal()">✕</button>
        </div>

        <div class="flex">
            <!-- Content -->
            <div class="flex-1 p-6 space-y-6">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
</dialog>
